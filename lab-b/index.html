<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista To Do</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="task-container">
    <input type="text" id="search" placeholder="Szukaj ...">
    <ul id="task-list"></ul>

    <div id="new-task">
        <input type="text" id="new-task-input" placeholder="Do zrobienia ...">
        <input type="date" id="due-date">
        <button id="add-task-btn">Zapisz</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
